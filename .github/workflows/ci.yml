name: RGDVD checks

on:
  push:
  pull_request:

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install game dependencies
        run: python -m pip install -r requirements.txt
      - name: Install online server dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Compile all Python modules
        run: python -m compileall -q main.py rgdvd tests server tools
      - name: Test vehicle, LAN protocol and career profile
        run: python -m unittest discover -s tests -v
      - name: Import online server
        working-directory: server
        run: python -c "from app import app; print(app.title)"
